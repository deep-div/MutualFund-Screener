<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>FundScreener</title>
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!--
      Per-page title, description, canonical and Open Graph / Twitter tags are
      managed at runtime by the <Seo> component (react-helmet-async) and baked
      into each route by the prerender step. Do NOT add a static description,
      canonical or og/twitter tag here — it would duplicate the per-page tags.
    -->
    <meta
      name="keywords"
      content="FundScreener, fund screener, mutual fund screener, mutual funds screener, compare mutual funds, mutual fund analysis, top mutual funds, best mutual funds, expense ratio, AUM, returns, risk, Indian mutual funds, SIP planning, ELSS funds, debt funds, equity funds"
    />
    <meta name="author" content="FundScreener" />
    <meta name="application-name" content="FundScreener" />
    <meta name="theme-color" content="#0f1729" />

    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4864592065223522"
      crossorigin="anonymous"
    ></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FundScreener",
        "alternateName": ["Fund Screener", "Mutual Fund Screener", "Mutual Funds Screener"],
        "url": "https://www.fundscreener.online/",
        "description": "Fund screener and mutual fund screener for analyzing and comparing funds."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
