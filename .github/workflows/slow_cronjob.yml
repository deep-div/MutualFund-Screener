name: Cron Job - Enriched 

on:
  schedule:
    # 08:00 AM IST on 1st of every month (GitHub Actions uses UTC)
    - cron: '30 2 1 * *'
  workflow_dispatch:

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mutualfund-screener:latest

      - name: Start container
        run: |
          docker run -d --name fundscreener-cron-enriched -p 80:80 \
            --env ENVIRONMENT="prod" \
            --env LOG_LEVEL="INFO" \
            --env MF_ENRICHMENT_ENABLED="true" \
            --env DB_HOST="${{ secrets.DB_HOST }}" \
            --env DB_PORT="${{ secrets.DB_PORT }}" \
            --env DB_NAME="${{ secrets.DB_NAME }}" \
            --env DB_USER="${{ secrets.DB_USER }}" \
            --env DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --env PIPELINE_TRIGGER_API_KEY="${{ secrets.PIPELINE_TRIGGER_API_KEY }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/mutualfund-screener:latest

      - name: Wait for service
        run: sleep 15

      - name: Trigger pipeline
        run: |
          curl --fail --show-error --silent -X POST "http://localhost/api/v1/pipeline/trigger" \
            -H "accept: application/json" \
            -H "x-api-key: ${{ secrets.PIPELINE_TRIGGER_API_KEY }}"

      - name: Stream container logs (live until done or 2 hour timeout)
        run: |
          timeout 7200 docker logs -f fundscreener-cron-enriched || true

      - name: Cleanup container
        if: always()
        run: |
          docker stop fundscreener-cron-enriched || true
          docker rm fundscreener-cron-enriched || true
